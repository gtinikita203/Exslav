name: Release Build
on:
  push:
    branches:
      - main
      - master
      - UI
      - NewUI
      - dev*
    paths:
      - "app/**"
      - "buildSrc/**"
      - "library/**"
      - "plugin/**"
      - "wdtt/**"
      - "run"
      - "gradle.properties"
      - "gradle/**"
      - "version.properties"
      - "**/*.gradle.kts"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      release:
        description: 'Release (y/n)'
        required: false
      prerelease:
        description: 'Mark as pre-release (y/n)'
        required: false
      tag:
        description: 'Release Tag'
        required: false
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache-dependency-path: |
            library/core/go.sum
            wdtt/go_client/go.sum
      - name: Setup Go Mobile
        # https://github.com/golang/mobile/blob/c31d5b91ecc32c0d598b8fe8457d244ca0b4e815/cmd/gomobile/init.go#L83
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260908204917-8b95e45f8d3e
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260908204917-8b95e45f8d3e
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r30
      - name: Core Lib Cache
        id: cache-core-lib
        uses: actions/cache@v6
        with:
          path: app/libs
          key: core-lib-release-${{ hashFiles('library/core/**', 'bin/lib/core/**', 'run') }}
      - name: Native Build
        if: steps.cache-core-lib.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          ./run lib core
      - name: WDTT Native Libs Cache
        id: cache-wdtt-libs
        uses: actions/cache@v6
        with:
          path: app/src/main/jniLibs
          key: wdtt-libs-${{ hashFiles('wdtt/**') }}
      - name: Build wdtt native libs
        if: steps.cache-wdtt-libs.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd wdtt && bash scripts/build-native-libs.sh
          cp -r app/src/main/jniLibs/* ../app/src/main/jniLibs/
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          path: app/libs/libexclavecore.aar
          name: "LibExclaveCore"
      - name: Gradle Cache
        uses: actions/cache@v6
        with:
          path: ~/.gradle
          key: gradle-release-v2-${{ hashFiles('**/*.gradle.kts') }}-${{ hashFiles('gradle.properties') }}
      - name: Gradle Build
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          ./gradlew --no-daemon :app:downloadAssets
          # Build variants one-by-one: concurrent OSS+Legacy KSP races on Room schema JSON
          ./gradlew --no-daemon :app:assembleOssRelease
          ./gradlew --no-daemon :app:assembleLegacyRelease
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: APKs
          path: app/build/outputs/apk/oss/release
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: APKs-legacy
          path: app/build/outputs/apk/legacy/release
  publish:
    name: Publish Release
    if: github.event_name == 'push' || (github.event.inputs.release == 'y' && github.event.inputs.tag != '')
    runs-on: ubuntu-latest
    needs: build
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: APKs
          path: artifacts/oss
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: APKs-legacy
          path: artifacts/legacy
      - name: Collect APKs
        run: |
          mkdir apks
          find artifacts -name "*.apk" -exec cp {} apks \;
          ls -la apks
      - name: Publish tagged release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''
        run: |
          if [ "${{ github.event.inputs.prerelease }}" = "y" ]; then
            gh release create "${{ github.event.inputs.tag }}" --notes="" --title="${{ github.event.inputs.tag }}" --prerelease ./apks/*
          else
            gh release create "${{ github.event.inputs.tag }}" --notes="" --title="${{ github.event.inputs.tag }}" ./apks/*
          fi
      - name: Publish latest release
        if: github.event_name == 'push' || github.event.inputs.tag == ''
        run: |
          set -euo pipefail
          NOTES="Build ${GITHUB_SHA} from ${GITHUB_REF_NAME}"
          if gh release view latest >/dev/null 2>&1; then
            gh release delete latest --yes --cleanup-tag
          fi
          gh release create latest ./apks/* --latest --target "${GITHUB_SHA}" --title "Latest" --notes "$NOTES"
          gh release view latest --json tagName,assets,url --jq '{tag: .tagName, url: .url, assets: [.assets[].name]}'
